name: "Home screen code refactoring"
description: "홈 화면 리팩터링 작업 이슈 템플릿"
title: "Home: Refactor - <짧은 요약>"
labels: [refactor, home-screen]
assignees: [ugmin1030]
body:
  - type: textarea
    id: description
    attributes:
      label: ✨ Description
      placeholder: |
        - 현재 Home 화면에서 ...
        - 리팩터링 목표: 성능/가독성/테스트 용이성 향상 등 -> 참고해서 작성해주세요:)
    validations: { required: true }

  - type: textarea
    id: implement
    attributes:
      label: ⚙️ What to do
      placeholder: |
        - ViewModel 분리
        - UseCase 도입
        - Compose 최적화
    validations: { required: true }

  - type: textarea
    id: checklist
    attributes:
      label: ✅ Checklist
      value: |
        - [ ] 기존 코드 구조 파악
        - [ ] ViewModel/UseCase 정의
        - [ ] 불필요한 리컴포지션 제거
        - [ ] 단위테스트 작성
    validations: { required: true }
